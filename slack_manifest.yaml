display_information:
  name: PatchAdvisor
  description: Autonomous cloud-native vulnerability triage.
  background_color: "#1a73e8"
features:
  bot_user:
    display_name: PatchAdvisor
    always_online: true
  interactivity:
    is_enabled: true
    request_url: https://<YOUR_CLOUD_RUN_URL>/slack/events
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    request_url: https://<YOUR_CLOUD_RUN_URL>/slack/events
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
